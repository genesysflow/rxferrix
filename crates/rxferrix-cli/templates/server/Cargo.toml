[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rxferrix = {{rxferrix_dep}}

# Password hashing (argon2id) is unbearably slow unoptimized; debug builds hash for real.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Its own workspace, also when created inside another one.
[workspace]
