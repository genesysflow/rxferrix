# Build flags for the SQLite that RxFerrix compiles in (the `libsqlite3-sys` crate reads LIBSQLITE3_FLAGS).
#
# SQLITE_ENABLE_MEMORY_MANAGEMENT makes every database connection share one page cache behind one global mutex: queries
# then run no faster in parallel than one at a time. Older versions of the crate defined it by default; these flags
# make sure it is off, and turn off SQLite's memory statistics, which take another global mutex. Cargo reads this file
# only when it builds from this directory, so keep it next to Cargo.toml (RxFerrix logs a warning at startup if SQLite
# was built with the shared page cache). Changing it rebuilds SQLite.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_DEFAULT_MEMSTATUS=0"
