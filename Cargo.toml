[workspace]
resolver = "3"
members = ["crates/ferrix", "crates/ferrix-macros", "crates/ferrix-cli", "examples/todo/server", "examples/chat-react/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Versions checked on crates.io 2026-10-09
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
linkme = "0.3.37"
ts-rs = "12.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3.0.6", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proptest = "1.11.0"

# Password hashing (argon2id) is unbearably slow unoptimized; tests and `serve` in debug builds hash for real.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Release binaries (`scripts/release.sh`): release plus link-time optimization, one codegen unit and no symbols.
# Panics must keep unwinding: a panicking function becomes an error instead of killing the server.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
