[package]
name = "ferrix-cli"
description = "The `ferrix` command: scaffolds new Ferrix apps (`ferrix new`)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ferrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
