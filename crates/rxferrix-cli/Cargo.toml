[package]
name = "rxferrix-cli"
description = "The `rxferrix` command: scaffolds new RxFerrix apps (`rxferrix new`) and runs them in development (`rxferrix dev`)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["reactive", "backend", "scaffold", "cli"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "rxferrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
notify = "8.2.1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
