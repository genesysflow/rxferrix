[package]
name = "rxferrix-macros"
description = "Procedural macros for RxFerrix: #[table], #[query], #[mutation], #[action], #[object], #[migration]"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
heck = "0.5.0"

[dev-dependencies]
insta = "1.49.0"
prettyplease = "0.2.37"
trybuild = "1.0.122"
futures = "0.3.34"
serde_json = "1.0.151"
anyhow = "1.0.104"
# Test-only stand-in for the runtime crate (CONTRACT.md §1-§2 items as stubs), so
# macro expansions can be type-checked and run before `crates/rxferrix` exists.
rxferrix = { path = "tests/mock", package = "rxferrix-mock" }
