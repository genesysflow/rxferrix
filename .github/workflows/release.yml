# Gates, the static musl release binary and the Docker image.
#
#   gates   every check of README "Development": rustfmt, Rust tests and clippy (no warnings), the macro tests, the TS type
#           check of generated code, the TS packages, the committed dashboard build, and the end-to-end tests
#           (dashboard, todo example, chat example) in Chromium.
#   olap         clippy and the tests with the `olap` feature (DuckDB, built from source: a job of its own, with its
#                own cache and disk; DuckDB is compiled once on a cold cache, and not at all with the cache warm).
#   release      scripts/release.sh: x86_64-unknown-linux-musl todo-server with the web app embedded (an artifact;
#                attached to the GitHub release for v* tags).
#   release-olap the same with `olap` (todo-server-olap), smoke-tested with `serve --olap`: for v* tags and manual
#                runs only (a cold build compiles DuckDB optimized and links with fat LTO: ~35 minutes).
#   docker       the Dockerfile (FROM scratch), smoke-tested, alongside the gates; docker-push pushes it to ghcr.io
#                for v* tags once both passed (from the layer cache).
#   publish-crates, publish-npm
#                for v* tags once the gates and olap passed: the crates to crates.io, the @rxferrix packages to npm
#                (with provenance), at the tag's version (`scripts/version.ts` must print it). Trusted publishing: no
#                token is stored; each crate and package names this workflow as its trusted publisher (README,
#                "Releasing"). A version already published is skipped, so a failed run can be rerun.
#
# A new push to a pull request cancels the run it supersedes; pushes to master and tags are never canceled. The gates'
# and olap caches are saved from master only (pull requests restore them), and even when a run fails, so an expensive
# build (DuckDB) isn't thrown away with a failing test. A canceled run must never save one: its key would then match
# exactly, so rust-cache would keep restoring that near-empty cache instead of saving a complete one (it happened:
# DuckDB was rebuilt on every run).
#
# Clippy runs with `--profile test`, after or before `cargo test`, so both share the build scripts' output: with the
# dev profile, every build script (DuckDB's C++, SQLite, aws-lc) would run twice. The build-override debug settings
# below keep their dependencies identical as well: by default, cargo strips the debug info of build-only
# dependencies, except those `cargo test` also builds for the target, and `cargo clippy` builds none of them.
#
# SQLite build flags: `.cargo/config.toml` sets LIBSQLITE3_FLAGS for every cargo build in the repository (the release
# script and the Docker build included). Nothing here may set LIBSQLITE3_FLAGS: an environment variable would replace
# them (the "sqlite flags" step checks).
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Full debug info made the gates job's target directory outgrow the runner's disk (the linker died with SIGBUS);
  # line tables keep backtraces' file:line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Build scripts and their dependencies the same way in `cargo test` and `cargo clippy --profile test` (see above).
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: line-tables-only

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: free disk space, in the background (the room is needed later)
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/checkout@v4

      - name: Rust (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # The `rxferrix new` apps and the macro tests build into target directories of their own.
          cache-directories: |
            target/tests/rxferrix-new
            target/macros

      - name: Chromium for the end-to-end tests
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: sqlite flags
        run: |
          test -z "${LIBSQLITE3_FLAGS:-}" || { echo "LIBSQLITE3_FLAGS must come from .cargo/config.toml"; exit 1; }
          grep -q 'LIBSQLITE3_FLAGS' .cargo/config.toml

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: JS packages
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: the crates and packages share one version
        run: bun scripts/version.ts

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --profile test --workspace --all-targets -- -D warnings

      - name: macro tests
        run: CARGO_TARGET_DIR=target/macros cargo test -p rxferrix-macros

      - name: generated TS type-checks
        run: cargo test -p rxferrix --test it codegen_typechecks_with_tsc -- --ignored

      - name: TS type check and tests
        run: bun run typecheck && bun run test

      - name: apps created by `rxferrix new` build and typecheck
        run: cargo test -p rxferrix-cli --test new -- --ignored

      - name: dashboard build is current
        run: bun run build:dashboard && bun run check:dashboard && git diff --exit-code -- crates/rxferrix/dashboard-dist

      - name: build the example servers
        run: cargo build -p todo-server -p chat-server && df -h /

      - name: dashboard e2e
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        working-directory: packages/dashboard
        run: bun e2e/dashboard.ts ../../target/debug/todo-server

      - name: todo e2e (two tabs, reconnect)
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          RXFERRIX_URL: http://127.0.0.1:8092
          VITE_PORT: "5175"
        working-directory: examples/todo/web
        run: |
          data="$(mktemp -d)"
          ../../../target/debug/todo-server serve --dev --dir "$data/a" --http 127.0.0.1:8092 > "$data/server.log" 2>&1 &
          server=$!
          bunx vite --strictPort > "$data/vite.log" 2>&1 &
          vite=$!
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:8092/api/health > /dev/null && curl -fsS http://localhost:5175/ > /dev/null && break
            sleep 0.3
          done
          bun e2e/two-tabs.ts http://localhost:5175
          kill "$server"; wait "$server" || true
          APP_URL=http://localhost:5175 bun e2e/reconnect.ts ../../../target/debug/todo-server "$data/b"
          kill "$vite" || true

      - name: chat e2e
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          BACKEND_PORT: "8099"
          VITE_PORT: "5182"
          SCREENSHOTS: ${{ runner.temp }}/e2e-shots
        working-directory: examples/chat-react/web
        run: mkdir -p "$SCREENSHOTS" && bun e2e/chat.ts

      - name: e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  olap:
    runs-on: ubuntu-24.04
    # DuckDB's C++ is compiled once on a cold cache (by clippy; the tests reuse it): ~25 minutes; a few with the cache.
    timeout-minutes: 90
    steps:
      - name: free disk space, in the background (the room is needed later)
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/checkout@v4

      - name: Rust (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: olap
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo clippy --features olap
        run: cargo clippy --profile test -p rxferrix -p todo-server --features rxferrix/olap,todo-server/olap --all-targets -- -D warnings

      - name: cargo test --features olap
        run: cargo test -p rxferrix --features olap --lib --test it && df -h /

  release:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: free disk space, in the background (the room is needed later)
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/checkout@v4

      - name: Rust (mise.toml), and mise for zig and cargo-zigbuild
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: scripts/release.sh
        run: scripts/release.sh

      - name: check the binary
        run: |
          file dist/todo-server | tee /dev/stderr | grep -q 'statically linked'
          dist/todo-server --help > /dev/null
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: todo-server-x86_64-linux-musl
          path: dist/todo-server
          if-no-files-found: error


      - name: attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/todo-server --clobber

  release-olap:
    needs: olap
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: free disk space, in the background (the room is needed later)
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/checkout@v4

      - name: Rust (mise.toml), and mise for zig and cargo-zigbuild
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-olap
          cache-on-failure: true

      - name: scripts/release.sh with olap, smoke-tested
        run: |
          FEATURES=olap OUT=dist-olap scripts/release.sh
          file dist-olap/todo-server | grep -q 'statically linked'
          data="$(mktemp -d)"
          dist-olap/todo-server serve --olap --dir "$data" --http 127.0.0.1:18091 > "$data/log" 2>&1 &
          server=$!
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:18091/api/health > /dev/null && break; sleep 0.3; done
          curl -fsS http://127.0.0.1:18091/api/health | grep -q ok
          sleep 1
          kill "$server"; wait "$server" || true
          grep -q 'analytics copy opened' "$data/log" || { cat "$data/log"; exit 1; }
          mkdir -p dist && mv dist-olap/todo-server dist/todo-server-olap
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: todo-server-olap-x86_64-linux-musl
          path: dist/todo-server-olap
          if-no-files-found: error

      - name: attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/todo-server-olap --clobber

  publish-crates:
    needs: [gates, olap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: the tag is the version
        run: test "v$(bun scripts/version.ts)" = "$GITHUB_REF_NAME"

      - name: crates.io token (trusted publishing, valid for this job only)
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      # In dependency order; `cargo publish` waits until each one is in the index, and builds the next one against it.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in rxferrix-macros rxferrix rxferrix-cli; do
            if curl -fsS -o /dev/null -A "rxferrix release (github.com/${GITHUB_REPOSITORY})" \
                "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

  publish-npm:
    needs: [gates, olap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: the tag is the version
        run: test "v$(bun scripts/version.ts)" = "$GITHUB_REF_NAME"

      - name: build
        run: |
          bun install --frozen-lockfile
          bun run build

      # `bun pm pack` writes the version of @rxferrix/client in place of `workspace:*`; npm publishes the tarball,
      # authenticated by the job's OIDC token, with a provenance statement. A prerelease (0.2.0-rc.1) is tagged `next`,
      # so `latest` stays on the last release.
      - name: npm publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          npm --version
          out="$RUNNER_TEMP/npm"
          for pkg in client react svelte; do
            if [[ "$(npm view "@rxferrix/$pkg@$version" version 2>/dev/null)" == "$version" ]]; then
              echo "@rxferrix/$pkg $version is already on npm"
              continue
            fi
            (cd "packages/$pkg" && bun pm pack --destination "$out" --ignore-scripts --quiet)
            npm publish "$out/rxferrix-$pkg-$version.tgz" --access public --tag "$tag"
          done

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: todo-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: |
          docker image inspect todo-server:ci --format '{{.Config.User}} {{.Config.Entrypoint}}'
          docker run --rm todo-server:ci functions | grep -q 'todos:'
          docker volume create rxferrix-ci
          docker run -d --name rxferrix-ci -p 18090:8090 -v rxferrix-ci:/data todo-server:ci
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:18090/api/health && break; sleep 0.3; done
          curl -fsS http://127.0.0.1:18090/api/health | grep -q ok
          docker logs rxferrix-ci 2>&1 | head -5
          docker rm -f rxferrix-ci

  docker-push:
    needs: [gates, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/todo-server
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push (the docker job's layers, from the cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
