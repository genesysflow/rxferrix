[package]
name = "rxferrix-cli"
description = "The `rxferrix` command: scaffolds new RxFerrix apps (`rxferrix new`)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "rxferrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
