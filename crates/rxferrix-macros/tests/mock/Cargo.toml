[package]
name = "rxferrix-mock"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Test-only mock of the rxferrix runtime items used by rxferrix-macros expansions (CONTRACT.md §1-§2)."

[lib]
# The dependent renames this crate to `rxferrix`, so `::rxferrix::...` paths resolve.
path = "src/lib.rs"

[dependencies]
linkme = "0.3.37"
ts-rs = "12.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
futures = "0.3.34"
