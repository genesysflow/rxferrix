[package]
name = "rxferrix"
description = "A single-binary reactive backend: typed Rust queries, mutations and actions, live over WebSockets, with auth, file storage, scheduling, search and an admin dashboard"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["reactive", "backend", "realtime", "sqlite", "websocket"]
categories = ["web-programming::http-server", "database"]

[dependencies]
rxferrix-macros = { path = "../rxferrix-macros", version = "0.9.0" }
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.7"
# Encryption at rest of secrets in `_settings` (XChaCha20-Poly1305).
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# Signature verification of external JWTs (RS256, ES256, EdDSA); already in the tree through rustls.
aws-lc-rs = "1.18.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures = "0.3.34"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
linkme = "0.3.37"
# File storage backends (local filesystem; S3-compatible with the `s3` feature). `cloud-base`: the `Signer` trait of
# `StorageConfig::signer`, whichever backends are compiled in.
object_store = { version = "0.14.2", default-features = false, features = ["fs", "cloud-base"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Embedded assets: the dashboard SPA, and apps' own frontends (`RxFerrix::embed_static`; re-exported as
# `rxferrix::rust_embed`).
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
# Vector search (`vec0` virtual tables), compiled in and linked against the bundled SQLite.
sqlite-vec = "0.1.9"
# Snowball stemmers for `#[search_index(.., tokenizer = "snowball", language = "..")]` (a custom FTS5 tokenizer).
rust-stemmers = "1.2.0"
# float_roundtrip: index keys are built from f64 values (e.g. `_creationTime`) that must survive the JSON round trip
# through storage bit-exactly; the default fast float parser can be off by one ULP.
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.0"
# TOTP second factors (RFC 6238, HMAC-SHA1).
sha1 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
url = "2.5.8"
# The trusted proxy's address ranges (`--trust-proxy-from`, the `trustedProxy` setting).
ipnet = "2.12.2"
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# `Uuid` in tables and function signatures (feature `uuid`).
uuid = { version = "1", default-features = false, features = ["serde"], optional = true }
# Per-cron time zones (IANA database compiled in).
chrono-tz = "0.10.4"
# Image thumbnails (`GET /api/storage/{id}?thumb=WxH`; feature `thumbnails`): decoders and encoders for the formats
# it accepts only.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }
# Operations (`ops`): backup archives (.tar.zst), static frontend serving, TLS (certificate files and Let's Encrypt).
tar = "0.4.46"
zstd = { version = "0.14.1", default-features = false }
mime_guess = "2.0.5"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
# The DNS names of a `--tls-cert` certificate, for the HTTP→HTTPS redirect (already a dependency of rustls).
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["std"] }
# Let's Encrypt certificates for `--https` (feature `acme`).
rustls-acme = { version = "0.15.4", default-features = false, features = ["aws-lc-rs", "tls12", "webpki-roots", "axum"], optional = true }

# DuckDB, compiled from its bundled C++ sources (feature `olap`).
duckdb = { version = "1.20000.0", features = ["bundled", "json"], optional = true }
# Parquet exports of analytics queries, written from DuckDB's Arrow batches (same Arrow major version as duckdb's).
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"], optional = true }
# The global allocator (feature `mimalloc`). musl's own malloc, which the release binaries (`scripts/release.sh`) would
# otherwise use, takes one lock for every allocation across threads.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
# Verifying imported bcrypt password hashes (`auth::password`).
bcrypt = "0.19.3"
# The QR code (as SVG) of a TOTP enrollment (`auth::totp`); no dependencies of its own.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[features]
default = ["dashboard", "s3", "acme", "thumbnails", "mimalloc"]
# S3-compatible file storage (AWS, R2, MinIO): `--storage s3://bucket/prefix`.
s3 = ["object_store/aws"]
# The admin dashboard SPA, embedded from `dashboard-dist/` and served at `/_/`. Its admin-only system functions and
# `/api/admin/*` endpoints exist either way.
dashboard = []
# Analytics: a columnar copy of the data in an embedded DuckDB, queried with read-only SQL from actions (`--olap`).
olap = ["dep:duckdb", "dep:parquet"]
# chrono's date and time types (`DateTime<Utc>`, `NaiveDate`, ...) in tables and function signatures: serde support and
# their TypeScript type (`string`, the RFC 3339 form serde writes).
chrono = ["chrono/serde", "ts-rs/chrono-impl"]
# `uuid::Uuid` in tables and function signatures (a `string` in TypeScript).
uuid = ["dep:uuid", "ts-rs/uuid-impl"]
# Automatic Let's Encrypt certificates (`serve --https <domain>`). Without it, `--https` fails at startup; HTTPS with
# certificate files (`--tls-cert`/`--tls-key`) works either way.
acme = ["dep:rustls-acme"]
# Image thumbnails (`GET /api/storage/{id}?thumb=WxH`). Without it, thumbnail requests get a 501
# (`thumbnails_unavailable`).
thumbnails = ["dep:image"]
# mimalloc as the process's global allocator, for any binary that links rxferrix. Measured with `bench_network`
# (2026-10-30), musl's malloc made HTTP calls 2.5-4.7x slower than glibc's. Turn it off (`default-features = false`) to
# use another allocator: a program can only have one `#[global_allocator]`.
mimalloc = ["dep:mimalloc"]

# Zero-downtime takeover (`serve --takeover`): the listening sockets are passed to the new process over a Unix socket.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "uio"] }

[dev-dependencies]
# Paused time in tests (`#[tokio::test(start_paused = true)]`).
tokio = { version = "1.53.2", features = ["full", "test-util"] }
# A failing `ObjectStore` wrapper in the replication tests (the trait is an `async_trait`).
async-trait = "0.1.92"
proptest = "1.11.0"
tokio-tungstenite = "0.30.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
